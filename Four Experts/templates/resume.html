<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Four Experts AI Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 700px;">
        <h3 class="mb-3 text-center">🤖 Four Experts AI System</h3>
        <div class="card p-3 shadow-sm mb-3" id="chatBox" style="height: 350px; overflow-y: auto; background: #fff;">
            <div class="text-muted">Type a query (e.g., 'Find MSU experience', 'Add Python skill', or 'Delete skills')</div>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" class="form-control" placeholder="Ask something...">
            <button class="btn btn-primary" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const message = input.value.trim();
            if(!message) return;

            chatBox.innerHTML += `<div><strong>You:</strong> ${message}</div>`;
            input.value = '';

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: message})
            });
            const data = await res.json();
            
            chatBox.innerHTML += `<div class="text-success mt-1"><strong>${data.expert || 'AI'}:</strong> ${data.message || JSON.stringify(data)}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
